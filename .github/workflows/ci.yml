name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout experimental Threadance dependency
        run: git clone --depth 1 --branch experiment/unstable https://github.com/igorbologovv/threadance.git ../threadance

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run the same checks as the pre-push hook
        run: bash scripts/ci-checks.sh
