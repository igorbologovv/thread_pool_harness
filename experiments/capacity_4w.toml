# Empirical four-worker saturated-capacity reference.
#
# This is not part of the fixed-arrival wait-policy grid. It estimates the
# observed service capacity of the same BLS workload with four Threadance
# workers under an all-at-once saturated queue.

[experiment]
name = "capacity-4w"
workload = "bls-aggregate-verify"
scheduler = "threadance"
profile = "none"

[workload]
workers = 4
work_units = 200
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 1000
threadance_spin_us = 0

[repetitions]
warmup_runs = 5
measured_runs = 30

[artifacts]
dataset_cache_dir = "results/datasets"
output_root = "results/calibrations"
