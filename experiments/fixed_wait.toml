# Final fixed-arrival Threadance wait-policy experiment.
#
# This file is the source of truth for the campaign grid and repetition design.
# The campaign runner should consume these values rather than duplicating them
# in shell code.

[experiment]
name = "fixed-wait"
workload = "bls-aggregate-verify"
scheduler = "threadance"
profile = "standard"

[workload]
# Keep the main wait-policy experiment below full-machine saturation. Worker-
# count scaling is studied separately; using four workers leaves CPU headroom
# for the pacer, perf, the benchmark thread, and normal kernel activity.
workers = 4
work_units = 200
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 1000

[delivery]
mode = "fixed-arrivals"
# rho is nominal offered load: lambda * E[S] / W.
rho = [0.25, 0.50, 0.67, 0.80, 0.91, 0.95]

[wait_policy]
spin_us = [0, 8, 16, 24, 32, 48, 64, 96]

[repetitions]
# Randomized complete blocks are the unit used for paired comparisons.
# Increasing the number of blocks gives better protection against slow
# thermal/frequency/background drift than concentrating repetitions inside a
# small number of blocks.
blocks = 20
measured_runs_per_block = 2

# Every scheduler instance receives the same warm-up treatment. One complete
# paced run is sufficient to start workers and touch the workload/code paths;
# unlike the old script there is no special first-block warm-up regime.
warmup_runs_per_block = 1

[randomization]
seed = 20261007

[artifacts]
dataset_cache_dir = "results/datasets"
calibration_cache_dir = "results/calibrations"
output_root = "results/sweeps"
