[experiment]
name = "fixed-wait"
workload = "bls-aggregate-verify"
profile = "standard"

[workload]
workers = 4
work_units = 200
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 1000

[delivery]
mode = "fixed-arrivals"
rho = [0.25, 0.50, 0.67, 0.80, 0.91, 0.95]

[repetitions]
blocks = 20
warmup_runs_per_block = 1
measured_runs_per_block = 2

[randomization]
seed = 20261007

[execution]
settle_seconds = 10.0

[analysis]
reference_configuration = "spin0"
bootstrap_replicates = 10000
bootstrap_seed = 20261007

[artifacts]
dataset_cache_dir = "results/datasets"
calibration_cache_dir = "results/calibrations"
output_root = "results/fixed_wait"

[[configurations]]
id = "spin0"
scheduler = "threadance"
wait_policy = "spin-then-park"
spin_us = 0

