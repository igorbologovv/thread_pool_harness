# Final fixed-arrival Threadance wait-policy experiment.
#
# This file is the source of truth for the campaign grid and repetition design.

[experiment]
name = "fixed-wait"
workload = "bls-aggregate-verify"
scheduler = "threadance"
profile = "standard"

[workload]
workers = 4
work_units = 200
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 1000

[delivery]
mode = "fixed-arrivals"
rho = [0.25, 0.50, 0.67, 0.80, 0.91, 0.95]

[wait_policy]
spin_us = [0, 8, 16, 24, 32, 48, 64, 96]

[repetitions]
blocks = 20
measured_runs_per_block = 2
warmup_runs_per_block = 1

[randomization]
seed = 20261007

[artifacts]
dataset_cache_dir = "results/datasets"
calibration_cache_dir = "results/calibrations"
output_root = "results/fixed_wait"
