[experiment]
name = "max-throughput"
workload = "bls-aggregate-verify"
profile = "none"

[workload]
workers = 4
work_units = 200
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 1000

[delivery]
mode = "all-at-once"

[repetitions]
blocks = 1
warmup_runs_per_block = 5
measured_runs_per_block = 30

[randomization]
seed = 20261013

[artifacts]
dataset_cache_dir = "results/datasets"
output_root = "results/max_throughput"

[[configurations]]
id = "threadance"
scheduler = "threadance"
wait_policy = "spin-then-park"
spin_us = 0
