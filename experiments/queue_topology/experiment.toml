[experiment]
name = "queue-topology-blocks"
workload = "bls-aggregate-verify"
profile = "standard"

[workload]
workers = 4
work_units = 1000
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 8

[delivery]
mode = "bursty-arrivals"
arrival_rates = [900.0, 1500.0]
arrival_seed_base = 42

[repetitions]
blocks = 20
warmup_runs_per_block = 1
measured_runs_per_block = 2

[randomization]
seed = 20261019

[execution]
settle_seconds = 3.0

[analysis]
reference_configuration = "rayon"
bootstrap_replicates = 10000
bootstrap_seed = 20261019

[artifacts]
dataset_cache_dir = "results/datasets"
output_root = "results/queue_topology"

[[configurations]]
id = "rayon"
scheduler = "rayon"

[[configurations]]
id = "threadance"
scheduler = "threadance"
queue_capacity = 8
wait_policy = "spin-then-park"
spin_us = 40

[[configurations]]
id = "hot-first"
scheduler = "threadance-hot-first"
queue_capacity = 8
hot_first_backlog = 2
wait_policy = "spin-then-park"
spin_us = 40
