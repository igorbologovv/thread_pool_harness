[experiment]
name = "bls-saturation-recheck-template"
workload = "bls-aggregate-verify"
profile = "standard"

[workload]
workers = 4
work_units = 2500
dataset_work_units = 2500
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 64

[delivery]
mode = "all-at-once"
arrival_seed_base = 42

[repetitions]
blocks = 30
warmup_runs_per_block = 4
measured_runs_per_block = 3

[randomization]
seed = 20261101

[execution]
settle_seconds = 0.0

[analysis]
reference_configuration = "rayon"
bootstrap_replicates = 10000
bootstrap_seed = 20261101

[artifacts]
dataset_cache_dir = "results/datasets"
output_root = "results/studies/bls-saturation-recheck/campaigns"

[[configurations]]
id = "rayon"
scheduler = "rayon"

[[configurations]]
id = "bevy"
scheduler = "bevy"

[[configurations]]
id = "mpmc-sp0"
scheduler = "threadance"
queue_capacity = 64
wait_policy = "spin-then-park"
spin_us = 0

[[configurations]]
id = "mpmc-ab"
scheduler = "threadance"
queue_capacity = 64
wait_policy = "agave-backoff"
spin_us = 0

[[configurations]]
id = "rtrb-sp0-b1"
scheduler = "threadance-hot-first-rtrb"
queue_capacity = 64
hot_first_backlog = 1
wait_policy = "spin-then-park"
spin_us = 0

[[configurations]]
id = "rtrb-sp0-b2"
scheduler = "threadance-hot-first-rtrb"
queue_capacity = 64
hot_first_backlog = 2
wait_policy = "spin-then-park"
spin_us = 0
