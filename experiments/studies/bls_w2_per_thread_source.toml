# Historical 2-worker 50%-load BLS source from the completed boost-control
# experiment, retained as a stand-alone, versioned reproducibility fixture.
# Dynamic study/phase names, seeds and output roots are replaced at runtime.
[experiment]
name = "bls-w2-boost-coherence-control-phase-01-on"
workload = "bls-aggregate-verify"
profile = "deep"

[workload]
workers = 2
work_units = 256
validators = 2000
signers_per_certificate = 1600
certificates_per_work_unit = 1
workload_seed = 1
queue_capacity = 64
dataset_work_units = 2500

[delivery]
mode = "fixed-arrivals"
arrival_rates = [647.0]
arrival_seed_base = 42

[repetitions]
blocks = 5
warmup_runs_per_block = 4
measured_runs_per_block = 2

[randomization]
seed = 20261111

[execution]
settle_seconds = 0.0

[analysis]
bootstrap_replicates = 10000
bootstrap_seed = 20261111

[artifacts]
dataset_cache_dir = "results/datasets"
output_root = "results/studies/bls-w2-boost-coherence-control/campaigns/phase-01-on"

[[configurations]]
id = "mpmc-sp0"
scheduler = "threadance"
wait_policy = "spin-then-park"
spin_us = 0
queue_capacity = 64

[[configurations]]
id = "rtrb-sp0-b2"
scheduler = "threadance-hot-first-rtrb"
wait_policy = "spin-then-park"
spin_us = 0
hot_first_backlog = 2
queue_capacity = 64

[perf]
passes = [{ name = "cpu-cache", events = ["cycles:uk", "instructions:uk", "cache-references:uk", "cache-misses:uk", "L1-dcache-load-misses:uk", "task-clock", "context-switches", "cpu-migrations", "page-faults"] }, { name = "l1-branches", events = ["cycles:uk", "L1-dcache-loads:uk", "L1-dcache-load-misses:uk", "branches:uk", "branch-misses:uk", "task-clock", "context-switches", "cpu-migrations", "page-faults"] }]
