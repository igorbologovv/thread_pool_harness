# Calibrate only 6/10/12; reuse archived 2/4/8/16 saturation rechecks.
[study]
name = "bls-worker-cubic-capacity-200ms"
template = "experiments/studies/bls_saturation_recheck_template.toml"
output_dir = "experiments/generated/bls-worker-cubic-capacity-200ms"
output_root = "results/studies/bls-worker-cubic-holdout-200ms/capacity/campaigns"
max_invocations = 500

[axes]
workers = [6, 10, 12]
schedulers = ["rayon"]

[overrides]
blocks = 30
warmup_runs_per_block = 4
measured_runs_per_block = 3
profile = "standard"
settle_seconds = 0.0