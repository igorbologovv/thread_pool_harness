# Coverage pilot for every scheduler / queue / wait family.
# Do not confuse this with the final statistical campaign.
[study]
name = "all-pools-pilot"
template = "experiments/queue_topology/experiment.toml"
output_dir = "experiments/generated/all-pools-pilot"
output_root = "results/studies/all-pools-pilot/campaigns"
max_invocations = 2500

[axes]
workers = [2, 4]
schedulers = ["rayon", "bevy", "threadance", "threadance-hot-first", "threadance-hot-first-rtrb"]
wait_policies = ["crossbeam-wait", "spin-then-park", "agave-backoff"]
spin_durations_us = [0, 40, 100]
queue_capacities = [8, 64]
hot_first_backlogs = [1, 2]
delivery_modes = ["all-at-once", "fixed-arrivals", "bursty-arrivals"]

[overrides]
blocks = 2
warmup_runs_per_block = 1
measured_runs_per_block = 2
settle_seconds = 1.0
